services:
  - type: web
    name: civitas-ai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: civitas-ai-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OLLAMA_HOST
        sync: false
      - key: RUN_MIGRATIONS
        value: "true"

  - type: web
    name: civitas-ai-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: civitas-ai-postgres
    databaseName: civitas_ai
    user: civitas_ai
