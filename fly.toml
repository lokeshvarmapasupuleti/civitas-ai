app = "civitas-ai-backend"
primary_region = "bom"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  AI_PROVIDER = "mock"
  RUN_MIGRATIONS = "true"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
